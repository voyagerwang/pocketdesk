<!--
 [INPUT]: 依赖 app/pad/compose 的首页、多图批次和输入能力，以及 screen 系列模块的画面工作台。
 [OUTPUT]: 提供首页 Dock、原生多图文件选择与缩略图容器、触控板、草稿和 PiP/全屏工作台。
 [POS]: Web 唯一手机入口；只收集文本与手势，听写由手机输入法提供。
 [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="zh-CN" data-page-node-id="VTBJVFChhQ27I8d5v4uvjR">
  <head data-page-node-id="nH457eBgGBApUNCe6Hmrhk">
    <meta charset="utf-8" data-page-node-id="qmpDI4iVTdfG382JO3eIPM">

    <meta name="theme-color" content="#eef1f7" data-page-node-id="M3mJO7EdrDJd3Wm0CngLkr">
    <title>PocketDesk</title>
    <!-- 主题由电脑端控制台统一决定，手机页经 /api/status 跟随（boot 与心跳应用）；此处预读 localStorage 仅作上次已知值的闪烁缓解。约定与控制台一致：data-theme="muji" = 米白，无属性 = 经典蓝。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('voicedeck.last-theme');
          if (t === 'muji') document.documentElement.setAttribute('data-theme', 'muji');
        } catch (e) { /* 无属性 = 经典蓝 */ }
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=3.0.13" data-page-node-id="Jz2kc4OQFzuCz2I2aKNELB">
    <link rel="stylesheet" href="/app-extras.css?v=3.0.7">
    <link rel="stylesheet" href="/screen.css?v=3.1.1">
  </head>
  <body data-page-node-id="2eqrPm23J7ToUXDDq0CibO">
    <main data-page-node-id="vqfJmN7gi1ptl0qmDEQ4Iv">

            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </header>
      <section class="deck" aria-label="输入到哪个应用" data-page-node-id="EaAbvM2CmNpnHkFvWSHnbk">
        <div id="targets" class="targets edge-fade scroll-cue" role="radiogroup" aria-label="目标应用列表" data-page-node-id="jpwaQeF5pcFlSohw7u7sUz"></div>
      </section>

      <section class="pad-card" id="pad-card" aria-label="触控板" data-page-node-id="WD6XWASiG4n39zid4esaFU">
        <div id="pad" tabindex="0" data-ruler="double" aria-label="触控板：单指移动光标，点按单击，双指滚动；方向键移动，回车单击，Esc 退出" data-page-node-id="zazCKZ3xiyFtCRUuMc1MES">
          <span class="pad-badge" data-page-node-id="zqwDwvua28BQWIg8Q1oRDZ">拖动中</span>
          <span class="pad-title" data-page-node-id="FxPaRcuOlIwaIyFSk04wty">轻点使用触控板</span>
          <p class="pad-hint" data-page-node-id="yZEiDx9vFDf9Xf2X0mRPTD">单击左键 · 双指单击右键</p>
        </div>
      </section>

      <section class="compose" aria-label="要输入的文本" data-page-node-id="0ZcVuev8NMMuOPyD02o9O6">
        <textarea id="text" rows="7" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="点这里，用手机键盘或听写输入…"></textarea>
        <div id="history-panel" class="history-panel" hidden data-page-node-id="LNyuhfSQtQRqKlrfGvAsUc">
          <div class="hist-head" data-page-node-id="nOYbSHqR3XF4fusuuaEo3W">
            <span data-page-node-id="wTD3PrCfDTFOjX4GYci23o">最近发送</span>
            <span class="hist-actions" data-page-node-id="MGnKue0tQahYCFFFRLdwzT">
              <button id="history-clear" class="hist-clear" type="button" data-page-node-id="WaNyqTariUtEHWp7Xg86oF">清空</button>
              <button id="history-collapse" class="hist-collapse" type="button" data-page-node-id="Qfd7qyxXn5eBCGFUko5APA">收起</button>
            </span>
          </div>
          <div id="history-list" data-page-node-id="JflToNfQz45VYZ5osaAEO1"></div>
        </div>
        <div id="image-preview" class="image-preview" hidden data-page-node-id="Yv01Wj6ITyutHDY731iuHu">
        </div>
        <div id="shortcut-bar" class="shortcut-bar edge-fade scroll-cue" hidden data-page-node-id="TeaIlnxQNQ7RaraSz0Zmay"></div>
        <div class="send-row" data-page-node-id="em7FkzTZWSz9iYE83BULnD">
          <button id="history-btn" class="hist-btn" type="button" title="历史发送" aria-pressed="false" data-page-node-id="Y100VYXHAc64BCCrfNW4D4">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-page-node-id="XZUAS5ZApgHmwafkZGESTG"><circle cx="12" cy="12" r="9" data-page-node-id="DzkvxOqWOlXicADkBn5cCD"/><path d="M12 7v5l3 3" data-page-node-id="eQqBkergJrQVTXDeTmDHPG"/></svg>
          </button>
          <button id="image-btn" class="hist-btn" type="button" title="插入图片" data-page-node-id="fNZZ2IolUWWftsYiY481gb">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-page-node-id="ImLXWk824rEUyKX94r4RIP"><rect x="3.5" y="5" width="17" height="14" rx="2.5" data-page-node-id="efX1ipXErBrHGgKtx7Uj8X"/><circle cx="9" cy="10" r="1.75" data-page-node-id="zjHtEDWjg8LpKhleleaG2w"/><path d="M3.5 16.5l4.6-4.6a1.5 1.5 0 0 1 2.12 0l4.53 4.53" data-page-node-id="99RpCzBCMZ2pKpfbFDfQVa"/><path d="M14.5 14l1.9-1.9a1.5 1.5 0 0 1 2.12 0l2 2" data-page-node-id="tDMoZzMOGqwPuB727pdk2o"/></svg>
          </button>
          <button id="screen-open" class="screen-open" type="button" aria-pressed="false" title="查看电脑画面" data-page-node-id="n7WGB3CIpFwMMxZX1c8yKE">
            <svg viewBox="0 0 24 24" aria-hidden="true" data-page-node-id="LgtCWtt1S0O2GtHHTNOcmF"><rect x="3" y="4" width="18" height="13" rx="2" data-page-node-id="N8IWiFon4CclsmzvNKXHnZ"/><path d="M8 21h8M12 17v4" data-page-node-id="BXWJc8Gq2yirAo1sKFnQ7n"/></svg>
          </button>
          <input id="image-file" type="file" accept="image/*" multiple hidden data-page-node-id="eyMy1tCUZvWADnbckpI1fH">
          <button id="send" type="button" data-page-node-id="lFyNzZ6hu8yMEIr9gF4sTE">发送</button>
        </div>
        <p id="message" role="status" aria-live="polite" data-page-node-id="e6wlP1uFgkcWptXxGMIOmZ"></p>
      </section>
    </main>

    <!-- 全屏工作台：画面视野、正立操作栏、输入区各占独立区域。 -->
    <dialog id="screen-view" class="screen-view pip" aria-label="电脑画面">
      <div class="screen-viewport">
        <div class="screen-surface">
        <img id="screen-image" alt="电脑当前画面" hidden draggable="false">
        <div id="screen-empty" class="screen-empty"><strong>正在连接电脑画面…</strong><p id="screen-empty-help"></p><button id="screen-permission" type="button" hidden>请求录屏授权</button></div>
        <div id="screen-cursor" class="screen-cursor" hidden aria-hidden="true"><svg viewBox="0 0 12 18"><path d="M1 1L1 14L4.5 10.5L7 16.5L9.2 15.5L6.7 9.8L11 9.8Z"/></svg></div>
        <div id="screen-aim" class="screen-aim" hidden aria-hidden="true"></div>
        <div id="screen-touch" class="screen-touch" hidden aria-hidden="true"></div>
        </div>
      </div>
      <nav id="screen-pip-displays" class="screen-pip-displays" aria-label="小窗显示器切换"></nav>
      <div id="screen-pip-tools" class="screen-pip-tools">
        <button id="screen-fullscreen" type="button" aria-label="进入全屏" title="进入全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        <button id="screen-pip-close" type="button" aria-label="关闭画面" title="关闭画面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <nav class="screen-toolbar" aria-label="全屏操作">
        <button id="screen-back" type="button"><svg viewBox="0 0 24 24"><path d="M14 5l-7 7 7 7"/></svg><span>返回</span></button>
        <button id="kb-toggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h1m3 0h1m3 0h1M7 12h1m3 0h1m3 0h1M8 16h8"/></svg><span>键盘</span></button>
        <button id="screen-switch" type="button" aria-label="切换显示器" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>屏幕 1</span></button>
        <button id="screen-more" type="button" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>更多</span></button>
      </nav>
      <div id="screen-notice" class="screen-notice" role="status" aria-live="polite" hidden></div>
      <section id="screen-menu" class="screen-menu" aria-label="画面与操作设置" hidden>
        <div class="screen-section-head"><strong>画面与操作</strong><button id="screen-menu-close" type="button">完成</button></div>
        <button id="screen-mode" type="button" aria-label="切换触屏与指针"><svg viewBox="0 0 24 24"><path d="M5 3l14 10-7 1-3 7z"/></svg><span>触屏</span></button>
        <label>显示器<select id="screen-display" aria-label="显示器"></select></label>
        <label>画面清晰度<select id="screen-quality"><option value="1280">流畅 · 1280</option><option value="1920">清晰 · 1920</option></select></label>
        <div class="screen-menu-grid"><button id="screen-fit" type="button">适应画面</button><button id="screen-adjust" type="button">调整视野</button><button id="screen-rightclick" type="button">指针处右键</button><button id="screen-refresh" type="button">重新连接画面</button><button id="screen-watch" type="button" aria-pressed="false">仅观看：关</button><button id="screen-takeover" type="button">接管控制</button></div>
        <p id="screen-help">点按操作 · 单指滑动阅读 · 双指缩放 · 长按显示操作</p>
        <div id="screen-shortcuts" class="screen-menu-grid" aria-label="常用快捷键"></div>
        <button id="screen-close" type="button">关闭电脑画面</button>
      </section>
      <div id="screen-context" class="screen-context" hidden><button id="screen-context-right" type="button">此处右键</button><button id="screen-context-drag" type="button">从此处拖动</button><button id="screen-context-cancel" type="button">取消</button></div>
      <section id="screen-compose" class="screen-compose" aria-label="输入到电脑" hidden>
        <div class="screen-compose-bar">
          <div id="screen-compose-editor"><textarea id="kb-proxy" class="kb-proxy" rows="1" enterkeyhint="enter" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="输入到电脑" placeholder="输入文字…"></textarea></div>
          <button id="screen-send" type="button" aria-label="发送文字" title="发送文字" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
          <button id="screen-keyboard-close" type="button" aria-label="收起键盘" title="收起键盘"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="screen-input-status" role="status" hidden></div>
        <!-- 实时同步状态：正常时是"已同步/实时输入已发出"，打断后是恢复进度。
             不设 role=status：每次同步成功都会改写它，做成 ARIA live region 会一直朗读。 -->
        <div id="live-flag" hidden></div>
      </section>
    </dialog>
    <!-- 手机设置：全站唯一入口（header 齿轮），底部模态；标题与关闭固定，内容可滚动。
         触控板三个控件由 .pad-tuning 整体迁来，ID 与 localStorage 键不变。 -->
    <dialog id="phone-settings" aria-labelledby="phone-settings-title">
      <div class="phone-sheet">
        <div class="sheet-head">
          <strong id="phone-settings-title">手机设置</strong>
          <button id="phone-settings-close" class="sheet-close" type="button" aria-label="关闭手机设置" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="sheet-note">仅影响这台手机</p>
        <div class="sheet-body">
          <section class="sheet-group" aria-label="触控板">
            <h2>触控板</h2>
            <label>光标<input id="sens" type="range" min="0.6" max="3" step="0.1" value="1.5"></label>
            <label>滚动<input id="scroll-speed" type="range" min="0.5" max="4" step="0.1" value="1.5"></label>
            <label>刻度<select id="ruler-mode"><option value="double">双排</option><option value="single">单排</option></select></label>
          </section>
          <!-- 翻腕组默认隐藏：只有环境层（安全上下文 + 传感器接口）过关才由 settings.js 打开。
               非安全上下文不展示开关、不提供证书下载或系统配置教程。 -->
          <section id="wrist-group" class="sheet-group" aria-label="翻腕发送" hidden>
            <h2>翻腕发送</h2>
            <label class="sheet-row">
              <span>翻腕发送</span>
              <input id="wrist-toggle" type="checkbox" role="switch" aria-describedby="wrist-note">
            </label>
            <p id="wrist-note" class="sheet-hint">手机向前轻翻，停住片刻后发送。</p>
            <div class="sheet-row">
              <span>灵敏度</span>
              <select id="wrist-sensitivity">
                <option value="low">低 30°</option>
                <option value="medium" selected>中 22°</option>
                <option value="high">高 15°</option>
              </select>
            </div>
          </section>
        </div>
      </div>
    </dialog>
    <script src="/app.js?v=3.0.24"></script>
    <script src="/pad.js?v=3.0.12"></script>
    <script src="/settings.js?v=3.0.7"></script>
    <script src="/compose-queue.js?v=3.0.17"></script>
    <script src="/compose.js?v=3.0.26"></script>
    <script src="/screen-geometry.js?v=3.0.2"></script>
    <script src="/screen-gestures.js?v=3.0.12"></script>
    <script src="/screen-pip.js?v=3.0.0"></script>
    <script src="/screen-frames.js?v=3.1.0"></script>
    <script src="/screen.js?v=3.1.0"></script>
    <script src="/motion-recognizer.js?v=3.1.0"></script>
    <script src="/motion-send.js?v=3.1.0"></script>
    <script>boot();</script>
  </body>
</html>
