           浏览器只对真正可聚焦的元素弹键盘，所以这个"看不见的输入框"省不掉。
           放进 dialog 内部是为了原生全屏（requestFullscreen）时它仍在渲染树里——
           挂在外面的话，进入原生全屏后整份文档只剩 panel 一个元素，代理直接失焦、键盘弹不出来。
           刻意钉在左上角：贴底的话浏览器为了把焦点元素露出来会滚动整页，画面就被"顶上去"了。 -->
      <textarea id="kb-proxy" class="kb-proxy" rows="1" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="唤起键盘" data-page-node-id="KbP00001"></textarea>
    </dialog>

    <!-- 全屏时点画面（点输入框）唤起的是**手机原生键盘本身**，这里没有、也不该有任何可见面板。
         原因很实在：竖屏全屏会把整层转 90°（.rotated），右上角的最小化/刷新/关闭转到了手机右侧，
         任何贴底的网页面板都会压住它们——那几个键是退出全屏的唯一出路，压住等于把人锁死在全屏里。
         发送键同理不自造：原生键盘右下角就是"发送"（enterkeyhint=send），按它等于回车提交。 -->
    <script src="/app.js?v=2.9.23"></script>
    <script src="/screen.js?v=2.9.23"></script>
  </body>
</html>
