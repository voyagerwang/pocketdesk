<!--
  [INPUT]: 依赖 style.css 的设计令牌与 app.js 的 Dock、触控板手势与 WebSocket 通道。
  [OUTPUT]: 单页布局：顶部（标题 + 当前应用 + 连接状态）、单行滚动 Dock、可展开触控板卡片（设置默认收起）、
            输入区（输入框下方的历史发送面板：清空带二次确认、收起按钮；图片预览）；目标选中态跟随 Mac 前台应用；
            右下角主题切换按钮（Muji ↔ classic，localStorage 持久化，head 内联脚本预应用避免闪烁）。
  [POS]: Web 的唯一页面入口；只收集文本与手势，绝不处理或上传语音。
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f3ee">
    <title>PocketDesk</title>
    <!-- 主题在样式表加载前内联应用，避免刷新闪现默认主题。 -->
    <script>
      (function () {
        var t = localStorage.getItem('voicedeck.theme') || 'muji';
        if (t === 'classic') document.documentElement.setAttribute('data-theme', 'classic');
      })();
    </script>
    <link rel="stylesheet" href="/style.css?v=1.8.1">
  </head>
  <body>
    <main>
      <header>
        <h1>PocketDesk</h1>
        <span id="pad-target" class="app-chip">ChatGPT</span>
        <span id="connection" class="pill" role="status" aria-live="polite">连接中</span>
      </header>
      <section class="deck" aria-label="输入到哪个应用">
        <div id="targets" class="targets" role="radiogroup" aria-label="目标应用列表"></div>
      </section>

      <section class="pad-card" id="pad-card" aria-label="触控板">
        <div id="pad" tabindex="0" aria-label="触控板：单指移动光标，点按单击，双指滚动；方向键移动，回车单击，Esc 退出">
          <button id="pad-settings" class="pad-gear" type="button" aria-expanded="false" title="光标与滚动设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="8" x2="20" y2="8"/><circle cx="14" cy="8" r="2.5" fill="currentColor" stroke="none"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="8" cy="16" r="2.5" fill="currentColor" stroke="none"/></svg>
          </button>
          <span class="pad-badge">拖动中</span>
          <span class="pad-title">触控板</span>
          <p class="pad-hint">单击左键 · 双指单击右键</p>
        </div>
        <div class="pad-tuning">
          <label>光标<input id="sens" type="range" min="0.6" max="3" step="0.1" value="1.5"></label>
          <label>滚动<input id="scroll-speed" type="range" min="0.5" max="4" step="0.1" value="1.5"></label>
        </div>
      </section>

      <section class="compose" aria-label="要输入的文本">
        <textarea id="text" rows="7" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="点这里，用手机键盘或听写输入…"></textarea>
        <div id="history-panel" class="history-panel" hidden>
          <div class="hist-head">
            <span>最近发送</span>
            <span class="hist-actions">
              <button id="history-clear" class="hist-clear" type="button">清空</button>
              <button id="history-collapse" class="hist-collapse" type="button">收起</button>
            </span>
          </div>
          <div id="history-list"></div>
        </div>
        <div id="image-preview" class="image-preview" hidden>
          <img id="image-thumb" alt="待发送图片">
          <button id="image-remove" class="image-remove" type="button" title="移除图片" aria-label="移除图片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <div id="shortcut-bar" class="shortcut-bar" hidden></div>
        <div class="send-row">
          <button id="history-btn" class="hist-btn" type="button" title="历史发送" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          </button>
          <button id="image-btn" class="hist-btn" type="button" title="插入图片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.75"/><path d="M3.5 16.5l4.6-4.6a1.5 1.5 0 0 1 2.12 0l4.53 4.53"/><path d="M14.5 14l1.9-1.9a1.5 1.5 0 0 1 2.12 0l2 2"/></svg>
          </button>
          <input id="image-file" type="file" accept="image/*" hidden>
          <button id="send" type="button">发送</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <button id="theme-toggle" class="theme-toggle" type="button" title="切换主题" aria-label="切换主题">M</button>

    <script src="/app.js?v=1.8.1"></script>
  </body>
</html>
