<script>
// 原版引擎完整运行，保留彩带前后遮挡与物理轨迹；只在右侧替换眼形。
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const original=['original','original-small'].map(id=>EmotionBall.create(document.getElementById(id),{emotion:'30',autostart:!reduced,lite:false,idle:false}));
EmotionBall.config.register({id:'preview-round',name:'圆眼彩虹',group:'custom',gaze:false,pool:[0],blinkMs:null,body:{orbit:1,breathe:.008},anims:[]});
let side=1,raf=0,paused=reduced;
const round=['stable','stable-small'].map(id=>{
 const e=EmotionBall.create(document.getElementById(id),{emotion:'preview-round',autostart:false,lite:false,idle:false,previewFloating:true});
 // 彩带复用前后遮挡，多个倾斜轨道覆盖身体四周。
 const body=e.ball.svg.children[2],eyes=[body.children[1],body.children[2]],apply=e.ball.applyPose;
 e.ball.applyPose=function(pose){
  apply(pose);
  const t=side,center=114+30*t,cy=99-15*t,half=25-2*t;
  eyes.forEach((eye,i)=>{
   const rx=15-4*t,ry=15+5*t,x=center+(i?half:-half),y=cy+(i?-3:3)*t;
   eye.setAttribute('d',`M ${-rx} 0 A ${rx} ${ry} 0 1 0 ${rx} 0 A ${rx} ${ry} 0 1 0 ${-rx} 0 Z`);
   eye.setAttribute('transform',`translate(${x} ${y}) rotate(${-22*t})`);
   eye.style.display='';
  });
 };
 e.renderStatic();e.setActive(!paused);return e;
});
const all=[...original,...round],select=document.getElementById('emotion');
window.EMOTION_SEED.forEach(def=>{const o=document.createElement('option');o.value=def.id;o.textContent=def.name;select.appendChild(o)});select.value='30';
select.onchange=()=>original.forEach(e=>{e.setEmotion(select.value);if(paused)e.renderStatic()});
function pose(value){side=Math.max(0,Math.min(1,value));round.forEach(e=>{if(paused)e.renderStatic()});document.getElementById('angle').value=Math.round(side*100);document.getElementById('label').textContent=side<.02?'正视':side>.98?'侧看':'转头中';}
function stop(){cancelAnimationFrame(raf);raf=0}
function replay(){stop();pose(1);if(reduced){pose(0);return}const start=performance.now();function frame(now){const p=Math.max(0,Math.min(1,(now-start-180)/1000));pose(1-p*p*(3-2*p));if(p<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
document.getElementById('replay').onclick=replay;
document.getElementById('front').onclick=()=>{stop();pose(0)};
document.getElementById('side').onclick=()=>{stop();pose(1)};
document.getElementById('angle').oninput=e=>{stop();pose(e.target.value/100)};
function syncActive(){all.forEach(e=>e.setActive(!paused&&!document.hidden));document.getElementById('pause').textContent=paused?'播放动效':'暂停动效'}
document.getElementById('pause').onclick=()=>{paused=!paused;if(paused)stop();syncActive()};
document.querySelectorAll('.orb').forEach(el=>el.onclick=replay);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();syncActive()});
pose(0);syncActive();
</script></html>
