name: cleanup
# 一次性清理：用内置 GITHUB_TOKEN 删掉本次排障产生的探针标签、临时 Release 与运行记录。
on:
  push:
    tags: ['cleanup-*']
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete probe tags, temporary release and probe runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          echo "== delete temporary release v0.3.2-rc1"
          REL_ID=$(api "https://api.github.com/repos/$REPO/releases/tags/v0.3.2-rc1" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')
          if [ -n "$REL_ID" ]; then api -X DELETE "https://api.github.com/repos/$REPO/releases/$REL_ID"; echo "deleted release $REL_ID"; fi

          echo "== delete probe tag refs"
          for TAG in v0.3.1-probe v0.3.2-rc1; do
            api -X DELETE "https://api.github.com/repos/$REPO/git/refs/tags/$TAG" || true
            echo "tag $TAG removed"
          done

          echo "== delete probe workflow runs"
          RUNS=$(api "https://api.github.com/repos/$REPO/actions/runs?per_page=50" | python3 -c 'import json,sys;print("\n".join(str(r["id"]) for r in json.load(sys.stdin)["workflow_runs"] if r["name"] in ("probe","cleanup")))')
          for ID in $RUNS; do
            api -X DELETE "https://api.github.com/repos/$REPO/actions/runs/$ID" || true
            echo "deleted run $ID"
          done
